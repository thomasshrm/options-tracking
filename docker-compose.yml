version: "3.9"

services:
  database:
    image: postgres:16-alpine
    container_name: options-tracking-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - options-network

  backend:
    build:
      context: ./backend
    container_name: options-tracking-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      - database
    networks:
      - options-network

  frontend:
    build:
      context: ./frontend
    container_name: options-tracking-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - options-network

networks:
  options-network:
    driver: bridge

volumes:
  db_data:

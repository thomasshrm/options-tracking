version: "3.9"

services:
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: options_tracking
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - options-net

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@database:5432/options_tracking
      JWT_SECRET: ${JWT_SECRET:-change_me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - database
    ports:
      - "4000:4000"
    networks:
      - options-net

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - options-net

networks:
  options-net:

volumes:
  db_data:

version: '3.9'

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: options
      POSTGRES_PASSWORD: options
      POSTGRES_DB: options_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://options:options@database:5432/options_db
      JWT_SECRET: changeme
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin1234
      ADMIN_USERNAME: Admin
    depends_on:
      - database
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  db_data:

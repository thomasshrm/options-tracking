version: "3.9"

services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "4000:4000"
    volumes:
      - backend-data:/app/data
    command: ["npm", "run", "start"]

  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_API_URL=http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend-data:
